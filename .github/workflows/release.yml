# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and release

on:
  push:
    branches:
      - "main"

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  Release:
    runs-on: "windows-latest"
    timeout-minutes: 10

    outputs:
      schemas_published: ${{ steps.publish-plan.outputs.schemas_published }}

    permissions:
      contents: write # Push git tags
      id-token: write # Required for OIDC

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6

      - name: "⚙️ Configure Git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "🗃️ Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Avoid caching https://codeql.github.com/codeql-query-help/actions/actions-cache-poisoning-direct-cache/#recommendation
          # cache: "pnpm"

      - name: "📐 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🏗️ Build"
        run: pnpm run build

      - name: "🖌️ Lint"
        run: pnpm run lint

      - name: "🧪 Test"
        run: pnpm run test

      - name: "📄 Prepare publish plan"
        id: "publish-plan"
        run: |
          pnpm changeset publish-plan --output publish-plan.json
          echo "schemas_published=$(jq 'any(.plan[][]; .name == "@elgato/schemas" and .kind == "publish")' publish-plan.json)" >> "$GITHUB_OUTPUT"

      - name: "📤 Publish"
        run: pnpm changeset publish

      - name: "🏷️ Push tags"
        run: git push --tags

      - name: "💾 Prepare schemas"
        if: steps.publish-plan.outputs.schemas_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: schemas
          path: packages/schemas/streamdeck/**/*.json
          if-no-files-found: error

  Documentation:
    needs: [Release]
    runs-on: "ubuntu-latest"

    steps:
      - name: "📄 Deploy documentation"
        run: curl --silent --output /dev/null -X POST "${{ secrets.DOCS_DEPLOY_HOOK }}"

  Schemas:
    needs: [Release]
    if: needs.Release.outputs.schemas_published == 'true'
    runs-on: "ubuntu-latest"

    steps:
      - name: "📥 Get schemas"
        uses: actions/download-artifact@v8
        with:
          name: schemas
          path: schemas/streamdeck/

      - name: "🔐 Configure credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-central-1"

      - name: "🔄️ Synchronize"
        run: aws s3 sync ./schemas/ ${{ secrets.AWS_S3_BUCKET }} --delete

      - name: "🌐 Invalidate CDN"
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*" > /dev/null

      - name: "🗑️ Cleanup artifact"
        uses: geekyeggo/delete-artifact@v6
        with:
          name: schemas
