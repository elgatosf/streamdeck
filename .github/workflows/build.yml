# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  pull_request:
    branches:
      - "*"

defaults:
  run:
    shell: bash

env:
  DOCS: --filter=@elgato/docs --filter=@elgato/markdown
  EXCLUDE_DOCS: --filter=!@elgato/docs --filter=!@elgato/markdown

jobs:
  Docs:
    name: Documentation pre-check

    runs-on: windows-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "🗃️ Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: "📐 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🏗️ Build"
        run: pnpm turbo run build $DOCS

      - name: "🖌️ Lint"
        run: pnpm turbo run lint $DOCS

      - name: "🧪 Test"
        run: pnpm turbo run test $DOCS

      - name: "📚 Check documentation"
        run: pnpm run docs:check

  Build:
    needs: Docs
    strategy:
      matrix:
        node_version: [24, 26]
        os: ["macos-latest", "windows-latest"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6

      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "🗃️ Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      - name: "📐 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🏗️ Build"
        run: pnpm turbo run build $EXCLUDE_DOCS

      - name: "🖌️ Lint"
        run: pnpm turbo run lint $EXCLUDE_DOCS

      - name: "🧪 Test"
        run: pnpm turbo run test $EXCLUDE_DOCS
